schema: hypertest.profile/v1
name: python-http-pytest-example

runtime:
  provider: pi
  model: deepseek-v4-pro
  max_repair_rounds: 2

adapters:
  sut:
    executable: adapters/sut/http-openapi
    config:
      contract_source: examples/python-http/openapi.yaml
  test:
    executable: adapters/test/pytest
  code:
    executable: adapters/code/lsp
    config:
      server: pyright-langserver
  coverage:
    executable: adapters/coverage/coverage-py
  sandbox:
    executable: adapters/sandbox/oci
  ci:
    executable: adapters/ci/gitlab
  scm:
    executable: adapters/scm/gitlab
