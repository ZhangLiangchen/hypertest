name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Both jobs run the whole suite (unit + integration + e2e) against a PostgreSQL 16 service container.
# NATS, Temporal, OPA and S3 are not provided: their integration tests skip with an explicit reason.
jobs:
  test:
    name: check + test (PGlite; PostgreSQL integration tests)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: hypertest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      HYPERTEST_TEST_PG_URL: postgres://postgres@localhost:5432/hypertest_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      # the test-runner adapters are exercised with real pytest and go test -json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false
      - name: Install pytest
        run: python -m pip install pytest
      # the local sandbox runs agent commands in unprivileged user namespaces (unshare + python3);
      # Ubuntu 24.04 restricts them through AppArmor by default
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Git identity for fixture repositories
        run: |
          git config --global user.name "Hypertest CI"
          git config --global user.email "ci@hypertest.invalid"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck and package boundaries
        run: npm run check
      - name: Test
        run: npm test
      # the core eval suites (context-freshness, model-switch, security-injection, test-generation) with the scripted
      # multi-LLM arm, gated against the committed baseline SuiteResult: critical false release not worse, defect recall
      # not significantly lower, security violations = 0, duplicate side effects = 0, evidence completeness 100 %
      - name: Eval release gate (core suites vs the committed baseline)
        run: npm run eval:gate
      - name: Upload the eval gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-gate
          path: .hypertest-eval/
          if-no-files-found: ignore

  test-postgres:
    name: test (everything on PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: hypertest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      HYPERTEST_TEST_PG_URL: postgres://postgres@localhost:5432/hypertest_test
      HYPERTEST_TEST_DB: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false
      - name: Install pytest
        run: python -m pip install pytest
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Git identity for fixture repositories
        run: |
          git config --global user.name "Hypertest CI"
          git config --global user.email "ci@hypertest.invalid"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Test on PostgreSQL
        run: npm test

  # Supply chain (technology-selection §许可证策略): license policy over the lockfile (fails on unknown/copyleft licenses
  # without a reviewed exception in scripts/license-exceptions.json), a CycloneDX SBOM as a build artifact, and the npm
  # vulnerability audit (informational: reported, never blocking — advisories change without a code change).
  supply-chain:
    name: supply chain (license policy, SBOM, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Supply-chain script tests
        run: npm run test:scripts
      - name: License policy
        run: npm run license:check
      - name: SBOM (CycloneDX)
        run: npm run sbom
      - name: Upload the SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: .hypertest-sbom.json
      - name: Vulnerability audit (informational)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
