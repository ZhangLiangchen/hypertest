<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">HyperTest target architecture: a test-development agent built on Pi</title>
  <desc id="desc">Target responsibility layers, not an execution sequence: HyperTest builds a test-development agent on Pi, consumes the stateless BUGate Protocol, and uses process/artifact adapters. LangGraph is conditional, not a prerequisite. Not all target capabilities are implemented.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#516784"/></marker></defs>
  <style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.t{font-size:15px}.s{font-size:13px}.b{rx:14;stroke-width:2}.l{stroke:#516784;stroke-width:2;fill:none;marker-end:url(#a)}</style>
  <rect width="1440" height="900" fill="#f7f9fc"/><text x="720" y="48" text-anchor="middle" class="title">HyperTest — Test-development agent built on Pi</text>
  <rect class="b" x="70" y="80" width="1300" height="105" fill="#fff8ea" stroke="#d79b36"/><text x="95" y="112" class="h">Entry</text>
  <g class="t" text-anchor="middle"><rect class="b" x="225" y="103" width="220" height="55" fill="#fff" stroke="#d79b36"/><text x="335" y="136">CLI / Web UI</text><rect class="b" x="480" y="103" width="220" height="55" fill="#fff" stroke="#d79b36"/><text x="590" y="136">GitLab CI</text><rect class="b" x="735" y="103" width="220" height="55" fill="#fff" stroke="#d79b36"/><text x="845" y="136">GitHub Actions</text><rect class="b" x="990" y="103" width="260" height="55" fill="#fff" stroke="#d79b36"/><text x="1120" y="136">Other CI / task entry</text></g>
  <rect class="b" x="70" y="220" width="1300" height="160" fill="#edf4ff" stroke="#4b78c2"/><text x="95" y="253" class="h">BUGate 2.0 — Stateless testing methodology protocol</text>
  <rect class="b" x="170" y="280" width="500" height="70" fill="#fff" stroke="#4b78c2"/><text x="420" y="311" text-anchor="middle" class="h">Protocol Bundle</text><text x="420" y="334" text-anchor="middle" class="s">Methods / Artifact, Evidence and Claim contracts / Versions</text>
  <rect class="b" x="770" y="280" width="500" height="70" fill="#fff" stroke="#4b78c2"/><text x="1020" y="311" text-anchor="middle" class="h">Assessment</text><text x="1020" y="334" text-anchor="middle" class="s">Quality assessment; HyperTest decides the next action</text><path class="l" d="M670 315h100"/>
  <rect class="b" x="70" y="415" width="1300" height="210" fill="#eef9f0" stroke="#4a9a63"/><text x="95" y="448" class="h">HyperTest — Task lifecycle, Pi integration, test capabilities and policy</text>
  <g text-anchor="middle"><rect class="b" x="120" y="480" width="270" height="105" fill="#fff" stroke="#4a9a63"/><text x="255" y="514" class="h">Task Lifecycle</text><text x="255" y="540" class="s">Tasks / Budgets / Workspaces</text><text x="255" y="562" class="s">ProtocolBinding / context hydration</text><rect class="b" x="430" y="480" width="270" height="105" fill="#fff" stroke="#4a9a63"/><text x="565" y="514" class="h">Pi / AgentRuntime</text><text x="565" y="540" class="s">Current: pi-agent-core + pi-ai</text><text x="565" y="562" class="s">Full Coding Agent SDK: evaluate</text><rect class="b" x="740" y="480" width="270" height="105" fill="#fff" stroke="#4a9a63"/><text x="875" y="514" class="h">Artifact Store</text><text x="875" y="540" class="s">Versioned / SHA-256 / Provenance</text><text x="875" y="562" class="s">JSON / patch / logs / coverage</text><rect class="b" x="1050" y="480" width="270" height="105" fill="#fff" stroke="#4a9a63"/><text x="1185" y="514" class="h">Repair Policy</text><text x="1185" y="540" class="s">Diagnosis / Preserve test oracles</text><text x="1185" y="562" class="s">Two-round limit / HyperTest policy</text></g>
  <rect class="b" x="70" y="660" width="1300" height="145" fill="#f4efff" stroke="#8164bd"/><text x="95" y="693" class="h">Process / artifact adapter layer</text>
  <g class="t" text-anchor="middle"><rect class="b" x="105" y="720" width="170" height="55" fill="#fff" stroke="#8164bd"/><text x="190" y="752">SUT</text><rect class="b" x="295" y="720" width="170" height="55" fill="#fff" stroke="#8164bd"/><text x="380" y="752">Test Framework</text><rect class="b" x="485" y="720" width="170" height="55" fill="#fff" stroke="#8164bd"/><text x="570" y="752">LSP / Code</text><rect class="b" x="675" y="720" width="170" height="55" fill="#fff" stroke="#8164bd"/><text x="760" y="752">Coverage</text><rect class="b" x="865" y="720" width="170" height="55" fill="#fff" stroke="#8164bd"/><text x="950" y="752">OCI Sandbox</text><rect class="b" x="1055" y="720" width="125" height="55" fill="#fff" stroke="#8164bd"/><text x="1117" y="752">CI</text><rect class="b" x="1200" y="720" width="125" height="55" fill="#fff" stroke="#8164bd"/><text x="1262" y="752">SCM</text></g>
  <path class="l" d="M720 185v35M720 380v35M720 625v35"/><text x="720" y="845" text-anchor="middle" class="t">Target responsibilities, not fixed stages. Current tool loop: planner-only. Broader capabilities require implementation.</text><text x="720" y="878" text-anchor="middle" class="t">LangGraph: conditional on recovery and coordination needs, not a prerequisite. ADR-0006 / ADR-0007.</text>
</svg>
