<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">HyperTest architecture</title>
  <desc id="desc">Layered HyperTest architecture with BUGate control plane, deterministic core, adapters, and external systems.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#516784"/></marker></defs>
  <style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.t{font-size:15px}.s{font-size:13px}.b{rx:14;stroke-width:2}.l{stroke:#516784;stroke-width:2;fill:none;marker-end:url(#a)}</style>
  <rect width="1440" height="900" fill="#f7f9fc"/><text x="720" y="48" text-anchor="middle" class="title">HyperTest — 通用测试开发 Agent</text>
  <rect class="b" x="70" y="80" width="1300" height="105" fill="#fff8ea" stroke="#d79b36"/><text x="95" y="112" class="h">接入层</text>
  <g class="t" text-anchor="middle"><rect class="b" x="225" y="103" width="220" height="55" fill="#fff" stroke="#d79b36"/><text x="335" y="136">CLI / Web UI</text><rect class="b" x="480" y="103" width="220" height="55" fill="#fff" stroke="#d79b36"/><text x="590" y="136">GitLab CI</text><rect class="b" x="735" y="103" width="220" height="55" fill="#fff" stroke="#d79b36"/><text x="845" y="136">GitHub Actions</text><rect class="b" x="990" y="103" width="260" height="55" fill="#fff" stroke="#d79b36"/><text x="1120" y="136">其他 CI / 调度入口</text></g>
  <rect class="b" x="70" y="220" width="1300" height="160" fill="#edf4ff" stroke="#4b78c2"/><text x="95" y="253" class="h">BUGate 质量控制平面（唯一策略权威）</text>
  <rect class="b" x="170" y="280" width="500" height="70" fill="#fff" stroke="#4b78c2"/><text x="420" y="311" text-anchor="middle" class="h">PDP</text><text x="420" y="334" text-anchor="middle" class="s">质量策略 / 风险 / 资源 / Wave 决策</text>
  <rect class="b" x="770" y="280" width="500" height="70" fill="#fff" stroke="#4b78c2"/><text x="1020" y="311" text-anchor="middle" class="h">PEP</text><text x="1020" y="334" text-anchor="middle" class="s">授权 receipt / 阻断 / 审计 / 强制执行</text><path class="l" d="M670 315h100"/>
  <rect class="b" x="70" y="415" width="1300" height="210" fill="#eef9f0" stroke="#4a9a63"/><text x="95" y="448" class="h">HyperTest Core（确定性产品语义）</text>
  <g text-anchor="middle"><rect class="b" x="120" y="480" width="270" height="105" fill="#fff" stroke="#4a9a63"/><text x="255" y="514" class="h">Run State Machine</text><text x="255" y="540" class="s">预算 / 超时 / 重试 / 恢复</text><text x="255" y="562" class="s">分析 → 生成 → 诊断 → 修复</text><rect class="b" x="430" y="480" width="270" height="105" fill="#fff" stroke="#4a9a63"/><text x="565" y="514" class="h">AgentRuntime</text><text x="565" y="540" class="s">pi-agent-core：唯一 SDK</text><text x="565" y="562" class="s">模型可切换，权限不可下放</text><rect class="b" x="740" y="480" width="270" height="105" fill="#fff" stroke="#4a9a63"/><text x="875" y="514" class="h">Artifact Store</text><text x="875" y="540" class="s">版本化 / SHA-256 / 可回放</text><text x="875" y="562" class="s">JSON / patch / logs / coverage</text><rect class="b" x="1050" y="480" width="270" height="105" fill="#fff" stroke="#4a9a63"/><text x="1185" y="514" class="h">Repair Policy</text><text x="1185" y="540" class="s">失败分类 / oracle 不弱化</text><text x="1185" y="562" class="s">最多两轮 + BUGate 门禁</text></g>
  <rect class="b" x="70" y="660" width="1300" height="145" fill="#f4efff" stroke="#8164bd"/><text x="95" y="693" class="h">进程 / 产物级 Adapter 层</text>
  <g class="t" text-anchor="middle"><rect class="b" x="105" y="720" width="170" height="55" fill="#fff" stroke="#8164bd"/><text x="190" y="752">SUT</text><rect class="b" x="295" y="720" width="170" height="55" fill="#fff" stroke="#8164bd"/><text x="380" y="752">Test Framework</text><rect class="b" x="485" y="720" width="170" height="55" fill="#fff" stroke="#8164bd"/><text x="570" y="752">LSP / Code</text><rect class="b" x="675" y="720" width="170" height="55" fill="#fff" stroke="#8164bd"/><text x="760" y="752">Coverage</text><rect class="b" x="865" y="720" width="170" height="55" fill="#fff" stroke="#8164bd"/><text x="950" y="752">OCI Sandbox</text><rect class="b" x="1055" y="720" width="125" height="55" fill="#fff" stroke="#8164bd"/><text x="1117" y="752">CI</text><rect class="b" x="1200" y="720" width="125" height="55" fill="#fff" stroke="#8164bd"/><text x="1262" y="752">SCM</text></g>
  <path class="l" d="M720 185v35M720 380v35M720 625v35"/><text x="720" y="850" text-anchor="middle" class="t">核心不内建语言、框架、SUT、覆盖率格式、CI 或 SCM 假设；保护动作由 BUGate receipt 绑定当前证据。</text>
</svg>
